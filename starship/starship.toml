"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
${custom.git_clean}\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[directory]
style = "bold lavender"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style)"

[git_status]
style = "peach"
format = "[ $all_status$ahead_behind]($style)"
modified = "[ ${count} modified](yellow)"
staged = "[ ${count} added](green)"
deleted = "[ ${count} deleted](red)"
untracked = "[ ${count} untracked](overlay1)"
renamed = "[ ${count} renamed](blue)"
conflicted = "[ ${count} conflicted](maroon)"
ahead = "[ ⇡${count}](green)"
behind = "[ ⇣${count}](red)"
diverged = "[ ⇡${ahead_count} ⇣${behind_count}](yellow)"

[custom.git_clean]
command = 'echo "✓"'
when = 'test -z "$(git status --porcelain 2>/dev/null)"'
style = "bold green"
format = " [$output]($style)"
shell = ["bash", "--nologin"]
require_repo = true

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_one_symbol = '[❮](bold lavender)'
vimcmd_replace_symbol = '[❮](bold lavender)'
vimcmd_visual_symbol = '[❮](bold yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
